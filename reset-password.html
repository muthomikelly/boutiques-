<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique — Reset Password</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand-logo">🔒</div>
    <h1 class="brand">Boutique</h1>
    <h2>Set a new password</h2>
    <p class="brand-sub">Choose a strong password for your account.</p>

    <div id="errorMsg" class="alert alert-error hidden"></div>
    <div id="successMsg" class="alert alert-success hidden"></div>

    <div id="formWrap">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Min. 6 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" />
      </div>
      <button id="submitBtn" class="btn-primary btn-full">Update Password</button>
    </div>

    <p class="link-row" style="margin-top:1.25rem;"><a href="/login.html">← Back to Login</a></p>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');

    if (!token) {
      document.getElementById('errorMsg').textContent = 'Invalid or missing reset link. Please request a new one.';
      document.getElementById('errorMsg').classList.remove('hidden');
      document.getElementById('formWrap').classList.add('hidden');
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const password = document.getElementById('newPassword').value;
      const confirm  = document.getElementById('confirmPassword').value;

      document.getElementById('errorMsg').classList.add('hidden');

      if (!password || !confirm) {
        document.getElementById('errorMsg').textContent = 'Please fill in both fields.';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        document.getElementById('errorMsg').textContent = 'Password must be at least 6 characters.';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        document.getElementById('errorMsg').textContent = 'Passwords do not match.';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (data.error) {
          document.getElementById('errorMsg').textContent = data.error;
          document.getElementById('errorMsg').classList.remove('hidden');
        } else {
          document.getElementById('formWrap').classList.add('hidden');
          document.getElementById('successMsg').textContent = data.message + ' Redirecting to login…';
          document.getElementById('successMsg').classList.remove('hidden');
          setTimeout(() => (location.href = '/login.html'), 2500);
        }
      } catch {
        document.getElementById('errorMsg').textContent = 'Network error. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('submitBtn').click();
    });
  </script>
</body>
</html>
