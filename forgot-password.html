<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique — Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand-logo">🔑</div>
    <h1 class="brand">GtecnoBoutique</h1>
    <h2>Forgot your password?</h2>
    <p class="brand-sub">Enter your email and we'll send you a reset link.</p>

    <div id="errorMsg" class="alert alert-error hidden"></div>
    <div id="successMsg" class="alert alert-success hidden"></div>

    <div id="formWrap">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <button id="submitBtn" class="btn-primary btn-full">Send Reset Link</button>
    </div>

    <!-- Dev mode: show link directly -->
    <div id="devLinkWrap" class="dev-link-box hidden">
      <p>⚠️ <strong>Dev mode</strong> — SMTP not configured.<br/>Use this link to reset:</p>
      <a id="devLink" href="#" class="dev-link-url"></a>
    </div>

    <p class="link-row" style="margin-top:1.25rem;"><a href="/login.html">← Back to Login</a></p>
  </div>

  <script>
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('successMsg').classList.add('hidden');
      document.getElementById('devLinkWrap').classList.add('hidden');

      if (!email) {
        document.getElementById('errorMsg').textContent = 'Please enter your email.';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res  = await fetch('/api/auth/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        const data = await res.json();

        if (data.error) {
          document.getElementById('errorMsg').textContent = data.error;
          document.getElementById('errorMsg').classList.remove('hidden');
        } else if (data.devLink) {
          // Dev mode — show the link on screen
          document.getElementById('devLinkWrap').classList.remove('hidden');
          const a = document.getElementById('devLink');
          a.href = data.devLink;
          a.textContent = data.devLink;
          document.getElementById('successMsg').textContent = data.message;
          document.getElementById('successMsg').classList.remove('hidden');
        } else {
          document.getElementById('successMsg').textContent = data.message;
          document.getElementById('successMsg').classList.remove('hidden');
          document.getElementById('formWrap').classList.add('hidden');
        }
      } catch {
        document.getElementById('errorMsg').textContent = 'Network error. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('submitBtn').click();
    });
  </script>
</body>
</html>
